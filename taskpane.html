<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Event to ICS Add-in</title>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- ical.js for ICS parsing and manipulation -->
    <script src="https://unpkg.com/ical.js/dist/ical.es5.min.cjs"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #fff;
            color: #222;
            transition: background 0.2s, color 0.2s;
        }
        .label { font-weight: bold; }
        .value { margin-bottom: 10px; display: block; }
        #calendar-metadata, #events-list {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .collapsible-section {
            border-radius: 6px;
            box-shadow: 0 1px 4px #0001;
            background: #f4f4f4;
            margin-bottom: 16px;
        }
        .collapsible-header {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 14px;
            font-weight: bold;
            font-size: 1.1em;
            user-select: none;
        }
        .collapsible-header .arrow {
            margin-right: 10px;
            font-size: 1.2em;
            transition: transform 0.2s;
        }
        .collapsible-header.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .collapsible-content {
            padding: 0 14px 10px 14px;
            display: block;
        }
        .collapsible-content.collapsed {
            display: none;
        }
        .event-block {
            background: none;
            box-shadow: none;
            border-radius: 0;
            margin-bottom: 0;
            position: relative;
            padding: 0;
        }
        .event-block input, .event-block textarea, #calendar-metadata input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            margin-bottom: 10px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccd;
            font-size: 14px;
            background: #fff;
            color: #222;
            transition: background 0.2s, color 0.2s;
        }
        .event-block label, #calendar-metadata label {
            font-weight: 500;
            display: block;
            margin-top: 8px;
        }
        .event-summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0;
        }
        .event-summary-label {
            flex: 1 1 auto;
            font-weight: 500;
        }
        .event-summary {
            min-height: 48px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .event-description {
            min-height: 64px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .delete-event-btn {
            margin-left: 12px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 14px;
            font-size: 13px;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 0;
        }
        .delete-event-btn:hover {
            background: #c0392b;
        }
        .button-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 18px;
            margin-bottom: 10px;
        }
        #add-event-btn, #download-ics {
            padding: 7px 18px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 1px 2px #0001;
        }
        #add-event-btn {
            background: #27ae60;
            color: #fff;
        }
        #add-event-btn:active {
            background: #1e8449;
        }
        #download-ics {
            background: #4a90e2;
            color: #fff;
        }
        #download-ics:active {
            background: #357ab8;
        }
        #loading { color: #888; margin-top: 20px; }
        #error { color: #b00; margin-top: 20px; }
        #settings-container { position: relative; margin-bottom: 20px; }
        #summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0;
        }
        #summary-header h2 {
            margin: 0;
            font-size: 1.6em;
            font-weight: bold;
        }
        #settings-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 0 0 12px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #settings-toggle svg {
            width: 28px;
            height: 28px;
            vertical-align: middle;
        }
        #settings {
            margin-top: 8px;
            padding: 0 12px;
            background: #eef;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
            border: 1px solid #dde;
            max-width: 100%;
            color: #222;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition:
                max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s,
                padding 0.25s,
                background 0.2s,
                color 0.2s;
            padding-top: 0;
            padding-bottom: 0;
        }
        #settings.visible {
            max-height: 600px;
            opacity: 1;
            padding-top: 16px;
            padding-bottom: 12px;
        }
        #settings label {
            display: block;
            margin-top: 12px;
            font-weight: 500;
        }
        #settings input, #settings textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccd;
            font-size: 14px;
            background: #fff;
            color: #222;
            transition: background 0.2s, color 0.2s;
        }
        #settings button[type="submit"] {
            margin-top: 16px;
            padding: 8px 18px;
            border-radius: 4px;
            border: none;
            background: #4a90e2;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 1px 2px #0001;
        }
        #settings button[type="submit"]:hover {
            background: #357ab8;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #settings-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 6px;
        }
        /* Dark mode styles */
        body.dark-mode {
            background: #292929;
            color: #eee;
        }
        body.dark-mode .collapsible-section {
            background: #232323;
            color: #eee;
        }
        body.dark-mode #calendar-metadata {
            background: #232323;
            color: #eee;
        }
        body.dark-mode #settings {
            background: #333a44;
            color: #eee;
            border: 1px solid #444;
        }
        body.dark-mode #settings input,
        body.dark-mode #settings textarea,
        body.dark-mode .event-block input,
        body.dark-mode .event-block textarea,
        body.dark-mode #calendar-metadata input {
            background: #232323;
            color: #eee;
            border: 1px solid #444;
        }
        body.dark-mode #settings button[type="submit"] {
            background: #357ab8;
            color: #fff;
        }
        body.dark-mode #settings button[type="submit"]:hover {
            background: #285a8c;
        }
        body.dark-mode #loading {
            color: #aaa;
        }
        body.dark-mode #error {
            color: #ff6b6b;
        }
        /* Custom dark scrollbars for event-block textareas */
        body.dark-mode .event-block textarea {
            scrollbar-color: #444 #232323;
            scrollbar-width: thin;
        }
        body.dark-mode .event-block textarea::-webkit-scrollbar {
            width: 10px;
            background: #232323;
        }
        body.dark-mode .event-block textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 6px;
        }
        body.dark-mode .event-block textarea::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
        body.dark-mode .event-block textarea::-webkit-scrollbar-corner {
            background: #232323;
        }
    </style>
</head>
<body>
    <div id="settings-container">
        <div id="summary-header">
            <h2>Event to ICS</h2>
            <button id="settings-toggle" title="Show/Hide Settings" aria-label="Show/Hide Settings">
                <!-- Inline SVG icon for settings -->
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#4a90e2"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31-8-57.5-23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
            </button>
        </div>
        <form id="settings">
            <div id="settings-title">ICS Generator Settings</div>
            <label>
                OpenAI API Key:
                <input type="password" id="apiKey" autocomplete="off" placeholder="sk-..." />
            </label>
            <label>
                OpenAI API URL:
                <input type="text" id="apiUrl" value="https://api.openai.com/v1/chat/completions" />
            </label>
            <label>
                Model:
                <input type="text" id="model" value="gpt-4.1" />
            </label>
            <label>
                System Prompt:
                <textarea id="systemPrompt" rows="4">Create a scheduling file for the event in the email. Your response should contain and only contain a markdown code block starting with ```ics and ending with ```. There should be nothing else.</textarea>
            </label>
            <button type="submit">Save & Generate ICS</button>
        </form>
    </div>
    <div id="loading" style="display:none;">Loading and generating ICS...</div>
    <div id="error" style="display:none;"></div>
    <div id="calendar-metadata" style="display:none;"></div>
    <div id="events-list" style="display:none;"></div>
    <div class="button-row" id="button-row" style="display:none;">
        <button id="add-event-btn">Add Event</button>
        <button id="download-ics">Download ICS</button>
    </div>
</body>
<script>
    // Settings keys for localStorage
    const LS_KEY = "emailEventICSSettings";
    function loadSettings() {
        const defaults = {
            apiKey: "",
            apiUrl: "https://api.openai.com/v1/chat/completions",
            model: "gpt-4.1",
            systemPrompt: "Create a scheduling file for the event in the email. Your response should contain and only contain a markdown code block starting with ```ics and ending with ```. There should be nothing else."
        };
        try {
            const saved = JSON.parse(localStorage.getItem(LS_KEY));
            return Object.assign({}, defaults, saved);
        } catch {
            return defaults;
        }
    }
    function saveSettings(settings) {
        localStorage.setItem(LS_KEY, JSON.stringify(settings));
    }
    function fillSettingsForm(settings) {
        document.getElementById("apiKey").value = settings.apiKey;
        document.getElementById("apiUrl").value = settings.apiUrl;
        document.getElementById("model").value = settings.model;
        document.getElementById("systemPrompt").value = settings.systemPrompt;
    }
    function getSettingsFromForm() {
        return {
            apiKey: document.getElementById("apiKey").value.trim(),
            apiUrl: document.getElementById("apiUrl").value.trim(),
            model: document.getElementById("model").value.trim(),
            systemPrompt: document.getElementById("systemPrompt").value.trim()
        };
    }

    function extractICSBlock(markdown) {
        // Extracts the first ```ics ... ``` code block
        const match = markdown.match(/```ics\s*([\s\S]*?)```/i);
        return match ? match[1].trim() : null;
    }

    async function generateICS(emailText, settings) {
        const messages = [
            { role: "system", content: settings.systemPrompt },
            { role: "user", content: emailText }
        ];
        const response = await fetch(settings.apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + settings.apiKey
            },
            body: JSON.stringify({
                model: settings.model,
                messages: messages,
                max_tokens: 1024,
                temperature: 0.3
            })
        });
        if (!response.ok) {
            throw new Error("OpenAI API error: " + response.status + " " + response.statusText);
        }
        const data = await response.json();
        if (data.choices && data.choices.length > 0) {
            return data.choices[0].message.content.trim();
        } else {
            throw new Error("No ICS returned from API.");
        }
    }

    function setLoading(loading) {
        document.getElementById("loading").style.display = loading ? "block" : "none";
        document.getElementById("calendar-metadata").style.display = "none";
        document.getElementById("events-list").style.display = "none";
        document.getElementById("button-row").style.display = "none";
        document.getElementById("error").style.display = "none";
    }
    function setError(msg) {
        document.getElementById("error").textContent = msg;
        document.getElementById("error").style.display = "block";
        document.getElementById("loading").style.display = "none";
        document.getElementById("calendar-metadata").style.display = "none";
        document.getElementById("events-list").style.display = "none";
        document.getElementById("button-row").style.display = "none";
    }

    // --- ICS Editor State ---
    let icalComponent = null; // ICAL.Component
    let veventComponents = []; // Array of ICAL.Component (VEVENTs)
    let calendarMeta = {}; // { prodid, version, calscale }

    // --- Collapsible Section Utility ---
    function createCollapsibleSection(title, contentHTML, collapsedByDefault, sectionId) {
        const section = document.createElement("div");
        section.className = "collapsible-section";
        section.id = sectionId || "";
        const header = document.createElement("div");
        header.className = "collapsible-header" + (collapsedByDefault ? " collapsed" : "");
        header.innerHTML = `<span class="arrow">&#9654;</span>${title}`;
        const content = document.createElement("div");
        content.className = "collapsible-content" + (collapsedByDefault ? " collapsed" : "");
        content.innerHTML = contentHTML;
        header.onclick = function() {
            const isCollapsed = content.classList.toggle("collapsed");
            header.classList.toggle("collapsed", isCollapsed);
        };
        section.appendChild(header);
        section.appendChild(content);
        return section;
    }

    // --- ICS Editor Rendering ---
    function renderICSEditor() {
        // Render calendar metadata (collapsible, collapsed by default)
        const metaDiv = document.getElementById("calendar-metadata");
        metaDiv.innerHTML = "";
        const metaContent = `
            <label>PRODID:
                <input type="text" id="meta-prodid" value="${escapeHTML(calendarMeta.prodid || '')}" />
            </label>
            <label>VERSION:
                <input type="text" id="meta-version" value="${escapeHTML(calendarMeta.version || '')}" />
            </label>
            <label>CALSCALE:
                <input type="text" id="meta-calscale" value="${escapeHTML(calendarMeta.calscale || '')}" />
            </label>
        `;
        const metaSection = createCollapsibleSection("Calendar Metadata", metaContent, true, "meta-collapsible");
        metaDiv.appendChild(metaSection);
        metaDiv.style.display = "block";

        // Attach change listeners for metadata
        setTimeout(() => {
            document.getElementById("meta-prodid").oninput = e => { calendarMeta.prodid = e.target.value; };
            document.getElementById("meta-version").oninput = e => { calendarMeta.version = e.target.value; };
            document.getElementById("meta-calscale").oninput = e => { calendarMeta.calscale = e.target.value; };
        }, 0);

        // Render events (each event collapsible, expanded by default)
        const eventsDiv = document.getElementById("events-list");
        eventsDiv.innerHTML = `<h3>Events</h3>`;
        veventComponents.forEach((vevent, idx) => {
            const event = new ICAL.Event(vevent);
            const start = event.startDate ? event.startDate.toString().replace("T", " ") : "";
            const end = event.endDate ? event.endDate.toString().replace("T", " ") : "";
            const summary = event.summary || "";
            const description = event.description || "";
            const uid = event.uid || "";
            const eventContent = `
                <div class="event-summary-row">
                    <span class="event-summary-label">Summary:</span>
                    <button class="delete-event-btn" title="Delete Event">Delete</button>
                </div>
                <textarea class="event-summary" rows="4">${escapeHTML(summary)}</textarea>
                <label>Start:
                    <input type="text" class="event-start" value="${escapeHTML(start)}" />
                </label>
                <label>End:
                    <input type="text" class="event-end" value="${escapeHTML(end)}" />
                </label>
                <label>Description:
                    <textarea class="event-description" rows="4">${escapeHTML(description)}</textarea>
                </label>
                <label style="display:none;">UID:
                    <input type="text" class="event-uid" value="${escapeHTML(uid)}" />
                </label>
            `;
            const eventSection = createCollapsibleSection(
                `Event ${idx + 1}`,
                `<div class="event-block">${eventContent}</div>`,
                false,
                `event-collapsible-${idx}`
            );
            // Attach listeners after DOM insertion
            setTimeout(() => {
                const block = eventSection.querySelector(".event-block");
                block.querySelector(".event-summary").oninput = e => { event.summary = e.target.value; };
                block.querySelector(".event-start").oninput = e => {
                    try {
                        event.startDate = ICAL.Time.fromString(e.target.value);
                    } catch {}
                };
                block.querySelector(".event-end").oninput = e => {
                    try {
                        event.endDate = ICAL.Time.fromString(e.target.value);
                    } catch {}
                };
                block.querySelector(".event-description").oninput = e => { event.description = e.target.value; };
                block.querySelector(".event-uid").oninput = e => { event.uid = e.target.value; };
                block.querySelector(".delete-event-btn").onclick = () => {
                    veventComponents.splice(idx, 1);
                    renderICSEditor();
                };
            }, 0);
            eventsDiv.appendChild(eventSection);
        });
        eventsDiv.style.display = "block";

        // Show add event and download buttons centered
        document.getElementById("button-row").style.display = "flex";
    }

    // --- ICS Parsing and State Setup ---
    function parseICSAndSetupEditor(ics) {
        try {
            const jcal = ICAL.parse(ics);
            icalComponent = new ICAL.Component(jcal);
            // Metadata
            calendarMeta = {
                prodid: icalComponent.getFirstPropertyValue("prodid") || "",
                version: icalComponent.getFirstPropertyValue("version") || "",
                calscale: icalComponent.getFirstPropertyValue("calscale") || ""
            };
            // Events
            veventComponents = icalComponent.getAllSubcomponents("vevent").map(vevent => vevent);
            renderICSEditor();
        } catch (err) {
            setError("Failed to parse ICS: " + err.message);
        }
    }

    // --- ICS Serialization and Download ---
    function updateICALComponentFromUI() {
        // Update calendar metadata
        if (icalComponent) {
            // Remove old properties
            ["prodid", "version", "calscale"].forEach(prop => {
                let p;
                while ((p = icalComponent.getFirstProperty(prop))) {
                    icalComponent.removeProperty(p);
                }
            });
            // Add new
            if (calendarMeta.prodid) icalComponent.addPropertyWithValue("prodid", calendarMeta.prodid);
            if (calendarMeta.version) icalComponent.addPropertyWithValue("version", calendarMeta.version);
            if (calendarMeta.calscale) icalComponent.addPropertyWithValue("calscale", calendarMeta.calscale);
            // Remove all old VEVENTs
            let v;
            while ((v = icalComponent.getFirstSubcomponent("vevent"))) {
                icalComponent.removeSubcomponent(v);
            }
            // Add current VEVENTs
            veventComponents.forEach(vevent => {
                icalComponent.addSubcomponent(vevent);
            });
        }
    }

    function downloadICS() {
        updateICALComponentFromUI();
        const ics = icalComponent.toString();
        const blob = new Blob([ics], { type: "text/calendar" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "event.ics";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }

    // --- Add Event ---
    function addBlankEvent() {
        // Create a new VEVENT with default values
        const vevent = new ICAL.Component("vevent");
        const now = ICAL.Time.now();
        const event = new ICAL.Event(vevent);
        event.summary = "New Event";
        event.startDate = now;
        event.endDate = now.clone();
        event.endDate.hour += 1; // 1 hour event
        event.uid = "uid-" + Date.now();
        veventComponents.push(vevent);
        renderICSEditor();
    }

    // --- Utility ---
    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>"']/g, function(m) {
            return ({
                '&': '&',
                '<': '<',
                '>': '>',
                '"': '"',
                "'": '&#39;'
            })[m];
        });
    }

    // --- Main Flow ---
    let lastEmailText = "";

    async function runICSGeneration(settings) {
        setLoading(true);
        Office.context.mailbox.item.body.getAsync(Office.CoercionType.Text, async function(result) {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
                lastEmailText = result.value;
                try {
                    const markdown = await generateICS(lastEmailText, settings);
                    const ics = extractICSBlock(markdown);
                    if (!ics) {
                        setError("No ICS found in response.");
                        return;
                    }
                    parseICSAndSetupEditor(ics);
                } catch (err) {
                    setError("Failed to generate ICS: " + err.message);
                }
            } else {
                setError("Unable to load email body.");
            }
        });
    }

    function applyDarkModeIfNeeded() {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        } else {
            document.body.classList.remove('dark-mode');
        }
    }

    Office.onReady((info) => {
        if (info.host === Office.HostType.Outlook) {
            // Apply dark mode on load
            applyDarkModeIfNeeded();
            // Listen for changes in system color scheme
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyDarkModeIfNeeded);
            }

            const settings = loadSettings();
            fillSettingsForm(settings);

            // Hide settings by default
            const settingsForm = document.getElementById("settings");
            settingsForm.classList.remove("visible");

            // Toggle button logic
            const toggleBtn = document.getElementById("settings-toggle");
            let settingsVisible = false;
            toggleBtn.addEventListener("click", function() {
                settingsVisible = !settingsVisible;
                if (settingsVisible) {
                    settingsForm.classList.add("visible");
                } else {
                    settingsForm.classList.remove("visible");
                }
            });

            // On load, if API key is set, run ICS generation
            if (settings.apiKey) {
                runICSGeneration(settings);
            }

            settingsForm.addEventListener("submit", function(e) {
                e.preventDefault();
                const newSettings = getSettingsFromForm();
                saveSettings(newSettings);
                runICSGeneration(newSettings);
                settingsVisible = false;
                settingsForm.classList.remove("visible");
            });

            // Add event and download buttons
            document.getElementById("add-event-btn").onclick = addBlankEvent;
            document.getElementById("download-ics").onclick = downloadICS;
        }
    });
</script>
</html>
